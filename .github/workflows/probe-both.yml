name: probe-both

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: install
        run: pip install --quiet curl_cffi
      - name: linuxdo-retry
        run: |
          python - <<'PY'
          import time, json
          from curl_cffi import requests as cr
          for attempt in range(1, 4):
              r = cr.get("https://linux.do/latest.json?page=0", impersonate="chrome", timeout=30,
                         headers={"accept": "application/json"})
              print(f"linuxdo attempt {attempt}: HTTP {r.status_code}, len={len(r.text)}")
              if r.status_code == 200:
                  try:
                      d = json.loads(r.text)
                      ts = d.get("topic_list", {}).get("topics", [])
                      print(f"  OK topics={len(ts)}, first={ts[0].get('title','')[:40] if ts else 'none'}")
                  except Exception as e:
                      print("  parse fail", e)
                  break
              time.sleep(25)
          PY
      - name: v2ex-api
        run: |
          python - <<'PY'
          import json
          from curl_cffi import requests as cr
          for url in ["https://www.v2ex.com/api/topics/latest.json",
                      "https://www.v2ex.com/api/topics/hot.json"]:
              r = cr.get(url, impersonate="chrome", timeout=30,
                         headers={"accept": "application/json", "user-agent": "Mozilla/5.0"})
              print(f"{url.split('/')[-1]}: HTTP {r.status_code}, len={len(r.text)}")
              if r.status_code == 200:
                  try:
                      d = json.loads(r.text)
                      print(f"  items={len(d)}, keys={list(d[0].keys()) if d else []}")
                      if d: print(f"  first={d[0].get('title','')[:40]}")
                  except Exception as e:
                      print("  parse fail", str(e)[:80], r.text[:80])
          PY

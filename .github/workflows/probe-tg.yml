name: probe-tg

on:
  workflow_dispatch:

jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: test
        env:
          TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          echo "=== sendMessage to 6867015060 ==="
          curl -sS --max-time 20 -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d "chat_id=6867015060" -d "text=test" -w "\nHTTP=%{http_code}\n" || echo "curl exit=$?"
          echo ""
          echo "=== getUpdates 原始 ==="
          curl -sS --max-time 20 "https://api.telegram.org/bot$TOKEN/getUpdates?limit=5" -w "\nHTTP=%{http_code}\n" || echo "curl exit=$?"
